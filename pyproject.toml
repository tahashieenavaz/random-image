[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "random_image"
dynamic = ["version"]
authors = [
  { name="Taha Shieenavaz", email="tahashieenavaz@gmail.com" },
]
description = "Get a random image in Python."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pillow", "pyyaml"]
keywords = ["image", "python", "productivity"]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/tahashieenavaz/random-image"
Repository = "https://github.com/tahashieenavaz/random-image"
Documentation = "https://github.com/tahashieenavaz/random-image#readme"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "figures*", "mermaid*", "scripts*"]

[tool.setuptools.package-data]
random_image = ["*.md", "*.txt", "*.png"]

[tool.setuptools_scm]